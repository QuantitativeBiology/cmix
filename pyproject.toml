[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmix"
version = "0.1.0"
description = "Lean linear mixed models for gene-by-gene association scans with a kinship matrix and covariates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Emanuel Goncalves" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels", "ruff", "jupyter", "nbconvert"]

[project.urls]
Repository = "https://github.com/QuantitativeBiology/cmix"

[tool.setuptools]
packages = ["cmix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# Upper-case names for matrices (K, M, G, Y, U, S) follow the statistical notation.
ignore = ["N803", "N806"]
